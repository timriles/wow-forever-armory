name: Sync WoW Forever Armory

on:
  push:
    branches:
      - main
    paths:
      - armory-config.json
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wow-forever-armory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Fetch characters from Blizzard Armory
        run: python3 sync_armory.py

      - name: Commit updated character data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- characters/

          if ! git diff --cached --quiet; then
            git commit -m "Update character armory data"
            git push
          fi
